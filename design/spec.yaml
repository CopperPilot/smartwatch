schema_version: rea-hardware/spec/v1
product:
  slug: rugged-smartwatch
  name: Rugged 49 mm Smartwatch
  summary: "49 mm rugged smartwatch with 1.9-inch IPS TFT display, side rotary crown encoder, side and action buttons, rear optical heart-rate sensor, rear magnetic pogo charging, and slide-in 49 mm sport band"
  category: wearable smartwatch
inputs:
  images: [inputs/front.jpg, inputs/front_side.jpg, inputs/rear.jpg]
  views:
    front: inputs/front.jpg
    right: inputs/front_side.jpg
    rear: inputs/rear.jpg
  prompt: inputs/prompt.md
envelope:
  width_mm: 44.0
  height_mm: 49.0
  depth_mm: 14.4
  corner_radius_mm: 11.0
  derivation: "Published 49 mm rugged smartwatch specification: 49.0 mm height x 44.0 mm width x 14.4 mm depth; verified aspect ratio and feature proportions with rea-hw measure on inputs/front.jpg, inputs/front_side.jpg, and inputs/rear.jpg"
  front_origin_world_mm: [-5.0, 4.5, 11.2]
fidelity:
  out_of_scope:
    - cellular LTE baseband and eSIM
    - dual-frequency L1/L5 GPS receiver
    - dive depth pressure gauge and water temperature sensor
    - acoustic speaker siren array and beamforming microphone array
    - wireless inductive Qi coil (implemented via rear magnetic spring pogo contacts per prompt)
    - engraved rear case perimeter text
  dimensions:
    - {name: case_width, kind: overall_width, value_mm: 44.0, tol_mm: 1.5, source: "Published 49 mm smartwatch case specification (44.0 mm width)"}
    - {name: case_height, kind: overall_height, value_mm: 49.0, tol_mm: 1.5, source: "Published 49 mm smartwatch case specification (49.0 mm height)"}
    - {name: case_depth, kind: overall_depth, value_mm: 14.4, tol_mm: 1.5, source: "Published 49 mm smartwatch case specification (14.4 mm total thickness including domed sensor back)"}
    - {name: case_corner_radius, kind: corner_radius, value_mm: 11.0, tol_mm: 1.5, source: "Measured plan-view corner radius from front.jpg and rear.jpg (11.0 mm)"}
    - {name: front_bezel, kind: bezel, value_mm: 1.75, tol_mm: 0.5, source: "Prompt and front.jpg measurement: 1.5-2.0 mm raised metal rim around flat cover glass"}
    - {name: side_wall_thickness, kind: edge_thickness, value_mm: 11.4, tol_mm: 1.5, source: "Measured from front_side.jpg and rear.jpg: lower titanium side profile excluding 3.0 mm domed sensor back"}
    - {name: center_dome_thickness, kind: center_thickness, value_mm: 14.4, tol_mm: 1.5, source: "Published 14.4 mm total center thickness across flat front cover glass and domed rear sensor back"}
  must_match:
    - id: F1
      name: 1.9-inch flat cover glass and display window
      kind: display
      view: front
      center_mm: [22.0, 24.5]
      size_mm: [32.0, 39.0]
      implement: case
      source: photo
      confidence: high
      notes: "Flat cover glass (40.4 x 45.4 x 1.0 mm) inside 1.75 mm raised metal bezel rim on 2.5 mm adhesive ledge over 35.0 x 42.0 x 1.5 mm display module and 32.0 x 39.0 mm inner aperture"
    - id: F2
      name: side rotary crown
      kind: switch
      view: right
      center_mm: [5.7, 19.5]
      size_mm: [9.5, 9.5]
      implement: pcb+case
      source: photo
      confidence: high
      notes: "Knurled rotary crown cap pressed onto horizontal shaft of side-mounted rotary encoder SW1 protruding through sealed bore in right crown guard"
    - id: F3
      name: right side button
      kind: button
      view: right
      center_mm: [5.7, 32.0]
      size_mm: [4.0, 10.5]
      implement: pcb+case
      source: photo
      confidence: high
      notes: "Pill-shaped metallic button below rotary crown on right guard actuating right-angle tactile switch SW2"
    - id: F4
      name: left orange action button
      kind: button
      view: left
      center_mm: [5.7, 32.0]
      size_mm: [4.0, 10.5]
      implement: pcb+case
      source: photo
      confidence: high
      notes: "Pill-shaped international-orange action button on left case wall actuating right-angle tactile switch SW3"
    - id: F5
      name: rear optical heart-rate sensor window
      kind: sensor
      view: rear
      center_mm: [22.0, 24.5]
      size_mm: [12.0, 12.0]
      implement: pcb+case
      source: photo
      confidence: high
      notes: "Central circular optical window in domed rear backplate over bottom-mounted MAX30102EFD+T PPG sensor U3"
    - id: F6
      name: rear magnetic charging contacts
      kind: port
      view: rear
      center_mm: [22.0, 34.5]
      size_mm: [6.0, 3.5]
      implement: pcb+case
      source: photo
      confidence: high
      notes: "Rear 2-pin gold-plated magnetic pogo charging contact opening on domed backplate over bottom-mounted J3 (mouth faces -Z out through rear opening)"
fab:
  profile: jlcpcb
  layers: 2
  thickness_mm: 1.0
  assembly_sides: [top, bottom]
electrical:
  mcu: "ESP32-S3-MINI-1-N8 (LCSC C2913206)"
  power: "Rear 5 V magnetic pogo charging input (J3, with TP9 on VCHG_RAW) protected by ESDLC12VLB 12 V bidirectional ESD/surge TVS clamp (D2, Vrwm = 12 V, Vbr = 14.0 V, Vc = 20 V at 6 A < 24 V), 100k bleed (R26), series 0603L050SLYR ultra-low-resistance 0.50 A hold / 1.00 A trip PPTC resettable fuse (F2, LCSC C207014, R_min = 70 mOhm, R_typ = 160 mOhm, R_1max = 350 mOhm, on VCHG_RAW -> VCHG_FUSED, tripping at 1.00 A to protect D1 1.0 A and U8 1.5 A while keeping total input IR drop < 250 mV at 500 mA), and upstream AO3401A reverse-polarity P-MOSFET (Q7, drain on VCHG_FUSED, source on VCHG_IN, gate pulled to GND by 100k R38 for full Vgs = -5 V drive and clamped by PESD5V0S1BL TVS D11 across Source-to-Gate), followed on VCHG_IN by 10 uF 35 V X5R 0603 input decoupling capacitor (C24, GRM188R6YA106MA73D) and ETA7014S2G 36 V input overvoltage protection load switch (U6, with internal soft-start controlling capacitive inrush and 135 degC thermal shutdown, programmed to 5.758 V typ / 5.521 V min / 5.996 V max OVP via 35.7k/10k 0.1% thin-film divider R27/R28 with 1k R29 and 1 uF 50 V C23 VCC filter), followed on VCHG_PROT (decoupled by 1 uF 25 V C26) by TPS2553DBVR 2.5-6.5 V (7.0 V Abs Max) 1.5 A 85 mOhm power-distribution switch with active reverse input-output voltage blocking (Irev = 0.01 uA typ / 1 uA max) and 2 us electronic current limiting (U8, LCSC C55266, EN tied to IN on VCHG_PROT, ILIM programmed by 35.7k 0.1% R41 to Ios = 667 mA min / 729 mA typ / 799 mA max < 1.0 A, OUT on VBUS), feeding MCP73832T-2ACI/OT 1S LiPo charger (U2, 6.0 V recommended / 7.0 V Abs Max, 147 mA via 6.8k R10, open-drain STAT on IO10 via 10k R23 to +3V3, 68k/100k R24/R25 digital VBUS sense divider on IO11 yielding 2.77-3.15 V > Vih_min = 2.475 V), 1S LiPo battery input (J2) protected on VBAT_IN by PESD5V0S1BL 5 V TVS diode (D9), ASMD0603SL100-12V 12 V 1.0 A hold / 2.0 A trip ultra-low-resistance (45 mOhm typ / 120 mOhm max) PPTC resettable fuse (F1), and AO3401A low-Rds(on) reverse-battery protection P-MOSFET (Q2, drain on VBAT_FUSED, source on VBAT, gate pulled to VBAT by 1M R34 and pulled to GND by BSS138K N-MOSFET Q6 gated via 100k R35 from VBAT_FUSED plus dual isolated 1N4148WS diodes D10 and D13 from VBUS feeding 100k R36 charger-side UVLO wake-up path on VBAT_WAKE and 100k R37 on VBAT_SENSE_WAKE to MMBT3904 NPN BJT Q8 and 1N5819WS Schottky diode D12 reverse-polarity lockout stage with zero battery bleed when VBUS = 0 V), AO3401A (Q1) + PMEG2010EA,115 low-leakage low-Vf MEGA Schottky (D1) single-diode-drop load-sharing power path with 1k VBUS gate pulldown (R13) and 10 uF 25 V VSYS bulk capacitor (C7), continuous TPS63031DSKR 3.3 V buck-boost converter (U4, LCSC C15516, with 1.5 uH inductor L1 WPN201610U1R5MT LCSC C97017, EN and PS/SYNC tied high to VSYS/VINA for forced PWM full-current mode, dedicated 100 nF VINA bypass C28 and 100 nF HF output bypass C3 within 1.5 mm of U4, and dual parallel 10 uF 25 V 0603 X5R output capacitors C8 and C27 at U4.1 VOUT), and continuous ME6211C18M5G-N 1.8 V 300 mA LDO (U5, CE tied to VSYS so MAX30102 VDD powers up simultaneously with VLED+)"
  blocks:
    - id: power
      purpose: "5 V magnetic pogo charging input (J3, TP9 on VCHG_RAW) with 12 V bidirectional ESD/surge clamp (D2 ESDLC12VLB, Vc = 20 V at 6 A < 24 V), 100k bleed (R26), series 0603L050SLYR ultra-low-resistance 0.50 A hold / 1.00 A trip PPTC resettable fuse (F2, LCSC C207014, R_min = 70 mOhm, R_typ = 160 mOhm, R_1max = 350 mOhm, on VCHG_RAW -> VCHG_FUSED), and upstream AO3401A reverse-polarity P-MOSFET (Q7 on VCHG_FUSED -> VCHG_IN, gated via 100k R38 to GND with PESD5V0S1BL Vgs clamp D11), feeding VCHG_IN with 10 uF 35 V X5R 0603 input bypass (C24 GRM188R6YA106MA73D) and ETA7014S2G 36 V OVP load switch (U6, set to 5.758 V typ / 5.521 V min / 5.996 V max via 0.1% thin-film R27=35.7k/R28=10k with R29=1k and 1 uF 50 V C23 VCC filter, soft-starting downstream capacitance), followed on VCHG_PROT (1 uF C26 bypass) by TPS2553DBVR 2.5-6.5 V (7.0 V Abs Max) 1.5 A 85 mOhm power-distribution switch with active reverse-voltage/reverse-current blocking and 2 us current limiting (U8, LCSC C55266, EN tied to IN on VCHG_PROT, ILIM set by 35.7k 0.1% R41 to 667-799 mA, OUT on VBUS), MCP73832T-2ACI/OT 1S LiPo linear charger programmed to 147 mA (R10=6.8k) with 3.3 V-safe open-drain STAT telemetry (R23=10k to +3V3 on IO10) and 68k/100k digital VBUS sense divider (R24=68k/R25=100k to IO11), battery connector (J2) protected on VBAT_IN by PESD5V0S1BL 5 V TVS (D9), series ASMD0603SL100-12V 12 V 1 A hold / 45 mOhm PPTC resettable fuse (F1), and AO3401A reverse-polarity protection P-FET (Q2) controlled by 1M gate pull-up (R34), BSS138K N-FET (Q6), 100k battery sense resistor (R35), and dual isolated 1N4148WS diodes (D10 on VBAT_WAKE -> 100k R36, D13 on VBAT_SENSE_WAKE -> 100k R37) VBUS wake-up and reverse-polarity lockout paths (producing Vgs(Q6) = 2.07-2.45 V at VBAT_FUSED = 0 V while eliminating battery bleed when VBUS = 0 V and restoring full Vgs(Q6) = V_VBAT_FUSED) with MMBT3904 NPN BJT (Q8) and 1N5819WS Schottky clamp (D12), AO3401A P-FET (Q1) + PMEG2010EA,115 low-leakage Schottky (D1) load-sharing switch with 1k gate pulldown (R13) and 10 uF 25 V VSYS bulk capacitance (C7), 1M/1M ultra-low-current VBAT ADC divider (R11/R12 + 100 nF C5), continuous TPS63031DSKR 3.3 V buck-boost regulator (U4, LCSC C15516) with 1.5 uH inductor (L1 WPN201610U1R5MT, LCSC C97017), EN and PS/SYNC tied high to VSYS, local 100 nF VINA bypass (C28) and 100 nF VOUT bypass (C3) within 1.5 mm, and 2x10 uF 25 V 0603 X5R output capacitors (C8, C27) at U4.1, and continuous ME6211C18M5G-N 1.8 V LDO (U5, CE tied to VSYS)"
      key_parts: [YZT0755-20028-02025-01, SM02B-SRSS-TB(LF)(SN), ASMD0603SL100-12V, 0603L050SLYR, ESDLC12VLB, ETA7014S2G, TPS2553DBVR, MCP73832T-2ACI/OT, AO3401A, BSS138K, MMBT3904, 1N4148WS, 1N5819WS, "PMEG2010EA,115", TPS63031DSKR, WPN201610U1R5MT, ME6211C18M5G-N]
      reference: "TI TPS2553 Datasheet (SLVS841G) Section 8.3.2 & 8.5.1, ETA Solutions ETA7014 Datasheet, Microchip MCP73832 Datasheet Section 6.0 Typical Application & TI TPS63031 Datasheet (SLVS696) Section 9.2"
    - id: mcu
      purpose: "ESP32-S3-MINI-1-N8 BLE 5.0 + Wi-Fi MCU module with 32.768 kHz RTC crystal (Y1 + 20 pF C21/C22 on IO15/IO16 for C_eff = 12.5 pF), RC EN reset network, TPS3421EGDRYR 7.5 s long-press push-button hardware reset controller (U9 on BTN_SIDE_SW -> MCU_EN), GPIO0 boot strapping, 22 Ohm series termination resistors (R15, R16) and PESD5V0U1BL ultra-low-capacitance ESD diodes (D3, D4) on USB D+/D-, and rear-side B.Cu test pads (TP1-TP9 including GND, +3V3, VCHG_RAW) for factory flashing"
      key_parts: [ESP32-S3-MINI-1-N8, TPS3421EGDRYR, Q13FC13500004, 0402CG200J500NT, PESD5V0U1BL]
      reference: "Espressif ESP32-S3-MINI-1 Datasheet Section 5 Peripheral Schematics & TI TPS3421 Datasheet"
    - id: display_ui
      purpose: "12-pin 0.5 mm double-sided FPC connector (J1, FPC-05FB-12PH20) for 1.9-inch ST7789V2 SPI IPS display (GMT169-01 / ZJY190S0800TG01) with local +3V3 logic decoupling (C15, C16) and 100k pull-up resistors (R39, R40) on LCD_CS and LCD_RES, dedicated LEDA backlight anode powered from VSYS (decoupled by 1 uF C25) and regulated by CAT4002ASD-GT3 2-channel low-dropout linear constant-current LED driver (U7, LED1+LED2 paralleled on LCD_LEDK for 41.7 mA total via R14=3.6k on RSET per 125x mirror ratio, dimmed on U7.1 EN/DIM via RTC GPIO21 / LCD_BL_DIM with 100k pulldown R17 using the CAT4002A 1-wire EZDim 32-level serial pulse-counting protocol: 1 to 31 low pulses of 1-50 us width, held static high between brightness changes and low >= 5 ms for shutdown), Alps EC05E1220203 horizontal-shaft rotary crown encoder (SW1), and two Alps SKRTLAE010 side-actuated tactile buttons (SW2, SW3) with 10k pull-ups (R3-R6) and PESD5V0S1BL bidirectional ESD TVS diodes (D5-D8) at the switch terminals, plus 10k series current-limiting/ESD-isolation resistors (R30-R33) feeding 10 nF encoder filter capacitors (C17, C18, limiting SW1 contact discharge current to <= 0.33 mA) and 100 nF button debounce capacitors (C19, C20)"
      key_parts: [FPC-05FB-12PH20, CAT4002ASD-GT3, EC05E1220203, SKRTLAE010, PESD5V0S1BL]
      reference: "Sitronix ST7789V2 4-wire SPI Application Circuit, onsemi CAT4002A Datasheet Figure 12 EN/DIM Timing & Alps Alpine EC05E / SKRT Series Application Notes"
    - id: heart_rate
      purpose: "MAX30102EFD+T optical PPG heart-rate and SpO2 sensor on bottom side of PCB powered by continuous 1.8 V VDD (U5, CE tied to VSYS so VDD powers up with VLED+; standby controlled via 0.7 uA I2C software shutdown) and isolated VSYS VLED+ (C6, C14), connected via 3-channel BSS138K low-capacitance (Ciss = 25 pF, Coss = 9.7 pF) sub-1V-threshold (Vgs(th) 0.4-1.0 V) bidirectional 1.8 V <-> 3.3 V level translators (Q3-Q5, with 1.8k I2C pull-ups R7, R8 to +1V8 and R20, R21 to +3V3 for 400 kHz Fast-Mode rise time tr ~ 70 ns << 300 ns, and 10k pull-ups R9 to +1V8 and R22 to +3V3 for active-low interrupt INT) to ESP32-S3"
      key_parts: [MAX30102EFD+T, BSS138K]
      reference: "Maxim/Analog Devices MAX30102 Datasheet Figure 9 Typical Operating Circuit & ElecSuper BSS138K Datasheet"
  nets_must_connect:
