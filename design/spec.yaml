enclosure:
  process: cnc
  wall_mm: 2.0
  clearance_floor_mm: 0.2
  parts:
    - id: case_body
      file: case/out/case_body.stl
      role: shell
      process: cnc
      material: "6061-T6 aluminum (titanium-tone anodised)"
      finish: "Bead-blasted matte natural titanium anodise"
      color: "#b8b4ac"
      description: "Main watch middle case with raised 1.75 mm front bezel rim, 1.5 mm internal cover-glass bonding ledge, right-side crown guard with sealed encoder bore and side-button slot, left-side action-button slot, and top/bottom 49 mm band lug channels"
    - id: cover_glass
      file: case/out/cover_glass.stl
      role: window
      process: cnc
      material: "Aluminosilicate / sapphire crystal glass"
      finish: "Optically clear with printed black perimeter border"
      color: "#101418"
      decor: case/out/cover_glass_decor.stl
      decor_color: "#0b0d11"
      description: "Flat 40.4 x 45.4 x 1.0 mm front cover glass bonded onto the front ledge of case_body inside the raised metal bezel rim"
