assembly:
  - {part: case_body, travel_mm: 0, held_by: base, note: "Primary CNC watch middle case"}
  - {part: display_panel, direction: [0, 0, -1], travel_mm: 20, may_touch: [case_body], held_by: captured, note: "Drops into front display pocket of case_body"}
  - {part: display_psa, direction: [0, 0, -1], travel_mm: 20, may_touch: [case_body, display_panel], held_by: captured, note: "Perimeter PSA gasket seated on front cover-glass ledge of case_body"}
  - {part: cover_glass, direction: [0, 0, -1], travel_mm: 20, may_touch: [case_body, display_psa, display_panel], held_by: adhesive, held_with: [display_psa], note: "Bonded onto 1.5 mm front ledge of case_body via display_psa"}
  - {part: battery, direction: [0, 0, 1], travel_mm: 25, may_touch: [case_body], held_by: captured, note: "Inserted from open rear into upper internal battery pocket before pcba installation"}
  - {part: pcba, direction: [0, 0, 1], travel_mm: 25, may_touch: [case_body], held_by: captured, note: "Main PCBA seated against internal bosses of case_body from open rear"}
  - {part: crown_cap, direction: [-1, 0, 0], travel_mm: 20, may_touch: [case_body, pcba], held_by: press_fit, held_with: [case_body], note: "Pressed onto horizontal shaft of rotary encoder SW1 through right-side sealed bore"}
  - {part: side_button, direction: [-1, 0, 0], travel_mm: 20, may_touch: [case_body, pcba], held_by: snap, held_with: [case_body], note: "Pushed in from right side (-X) until snap barbs lock behind right case wall"}
  - {part: action_button, direction: [1, 0, 0], travel_mm: 20, may_touch: [case_body, pcba], held_by: snap, held_with: [case_body], note: "Pushed in from left side (+X) until snap barbs lock behind left case wall"}
  - {part: rear_cover, direction: [0, 0, 1], travel_mm: 25, may_touch: [case_body, pcba], held_by: press_fit, held_with: [case_body], note: "Domed rear sensor cover press-fit into rear counterbore of case_body capturing pcba"}
  - {part: sensor_window, direction: [0, 0, 1], travel_mm: 20, may_touch: [rear_cover], held_by: press_fit, held_with: [rear_cover], note: "Circular optical sensor lens press-fit into central aperture of rear_cover"}
  - {part: strap_band, direction: [1, 0, 0], travel_mm: 48, may_touch: [case_body], held_by: strap_lock, note: "Standard 49 mm band connector bars slide sideways (+X) into top and bottom lug channels"}
