decisions:
  - question: "MCU and wireless architecture for wearable UI and BLE sync?"
    choice: "ESP32-S3-MINI-1-N8 (C2913206) running at 3.3 V with local 100 nF (C1 at 8.29, 3.85 mm) and 10 uF (C13 at 8.38, 5.85 mm) decoupling placed within 1.5-2.0 mm of U1 pin 3 (3V3 at 10.02, 4.75 mm), external 32.768 kHz RTC crystal (Y1, C32346 + 20 pF C21/C22, C1554, for C_eff = 12.5 pF) on IO15/IO16, TPS3421EGDRYR reset supervisor (U9 at 31.25, 23.80 mm) with local 100 nF bypass capacitor (C4 at 30.10, 23.45 mm, 0.77 mm from U9.4 VCC), and on-module PCB antenna at the top board edge"
    reason: "Dual-core 240 MHz Xtensa LX7 with 512 KB SRAM easily drives a 170x320 16-bit SPI display (108.8 KB frame buffer) and BLE 5.0 while the 20 ppm 32.768 kHz crystal loaded with 20 pF shunt capacitors (10 pF series + 2.5 pF stray = 12.5 pF) maintains accurate RTC timekeeping and BLE sleep timing; functionally grouping and placing C1 (100 nF) and C13 (10 uF) within 1.5-2.0 mm of U1 pad 3 (10.02, 4.75 mm) and C4 (100 nF) adjacent to U9 pad 4 (30.86, 23.30 mm) provides low-inductance high-frequency and bulk decoupling per Espressif ESP32-S3-MINI-1 and TI TPS3421 layout guidelines."
  - question: "Power tree and datasheet limit verification across every hop?"
    choice: "5 V rear magnetic pogo input (J3, TP9 on VCHG_RAW) -> ESDLC12VLB 12 V bidirectional ESD/surge TVS clamp (D2, Vc = 20 V at 6 A < 24 V) + 100k bleed (R26) + 0603L050SLYR ultra-low-resistance 0.50 A hold / 1.00 A trip PPTC resettable fuse (F2, LCSC C207014, R_min = 70 mOhm, R_typ = 160 mOhm, R_1max = 350 mOhm, on VCHG_RAW -> VCHG_FUSED) + AO3401A reverse-polarity P-MOSFET (Q7, drain on VCHG_FUSED, source on VCHG_IN, gate pulled to GND via 100k R38 and clamped by PESD5V0S1BL D11) -> 10 uF 35 V X5R 0603 input capacitor (C24 GRM188R6YA106MA73D) -> ETA7014S2G 36 V OVP load switch (U6, set to 5.758 V typ / 5.521 V min / 5.996 V max OVP via 35.7k/10k 0.1% thin-film R27/R28 with 1k R29 and 1 uF 50 V C23 VCC filter) -> VCHG_PROT (1 uF 25 V C26) -> TPS2553DBVR 2.5-6.5 V (7.0 V Abs Max) 1.5 A 85 mOhm current-limited power-distribution switch with active reverse input-output voltage blocking (U8, LCSC C55266, EN tied to IN on VCHG_PROT, ILIM programmed to 667-799 mA via 35.7k 0.1% R41, OUT on VBUS) + 4.7 uF C11 -> MCP73832T-2ACI/OT (U2, 6.0 V recommended / 7.0 V Abs Max, Vreg 4.20 V, Iprog 147 mA via 6.8k R10, open-drain STAT to IO10 via 10k R23 to +3V3, 68k/100k R24/R25 digital VBUS sense divider to IO11) + J2 battery connector protected on VBAT_IN by PESD5V0S1BL 5 V TVS diode (D9), ASMD0603SL100-12V 12 V 1.0 A hold / 45 mOhm PPTC resettable fuse (F1), and AO3401A reverse-polarity protection P-MOSFET (Q2, drain on VBAT_FUSED, source on VBAT, gate controlled by 1M R34, BSS138K Q6, 100k R35 from VBAT_FUSED, and dual isolated 1N4148WS diodes D10 and D13 from VBUS feeding 100k R36 UVLO wake-up path on VBAT_WAKE and 100k R37 on VBAT_SENSE_WAKE to MMBT3904 Q8 + 1N5819WS D12 reverse-battery lockout) + AO3401A (Q1) / PMEG2010EA,115 low-leakage MEGA Schottky (D1) single-diode-drop load-sharing path (with 1k VBUS pulldown R13 and 10 uF C7) -> continuous TPS63031DSKR 3.3 V buck-boost converter (U4, LCSC C15516, with 1.5 uH inductor L1 WPN201610U1R5MT LCSC C97017, EN and PS/SYNC tied high to VSYS, dedicated 100 nF VINA bypass C28 and 100 nF HF VOUT bypass C3 within 1.5 mm of U4, and 2x10 uF 25 V 0603 X5R output capacitors C8 and C27 at U4.1 VOUT) + continuous ME6211C18M5G-N 1.8 V 300 mA LDO (U5, CE tied to VSYS for MAX30102 VDD)"
    reason: "On J3.1 (VCHG_RAW), 12 V bidirectional TVS D2 (ESDLC12VLB, Vrwm = 12 V, Vbr = 14.0 V, Vc = 20 V at 6 A) clamps both positive and negative transients within +/-20 V, keeping negative spikes well inside Q7 (AO3401A) V_DS(max) = -30 V when Q7 is off and keeping positive transients on VCHG_IN below 20 V so U6.1 (OVP_FB, driven via R27=35.7k / R28=10.0k) never exceeds 4.38 V (< 6.0 V Abs Max). Series ultra-low-resistance 0.50 A hold / 1.00 A trip PPTC resettable fuse F2 (0603L050SLYR, LCSC C207014, R_min = 70 mOhm, R_typ = 160 mOhm, R_1max = 350 mOhm) on VCHG_RAW -> VCHG_FUSED trips at 1.00 A (<= 1.25 A) to protect D1 (PMEG2010EA,115, 1.0 A max) and U8 (TPS2553DBVR, 1.5 A max) while keeping total input IR drop at 500 mA to (160 + 50 + 40 + 85) mOhm * 0.5 A = 168 mV typ (< 250 mV) and 81 mV typ (127 mV post-trip) at the 242 mA max load, while U6 opens in <1 us above 5.758 V (< 6.0 V) so F2 only ever interrupts fault currents within its <= 6.0 V pass window. Downstream on VCHG_IN, 0.1% thin-film divider R27=35.7k / R28=10.0k with ETA7014S2G V_FB = 1.26 V +/- 0.05 V (1.21-1.31 V) sets V_OVP(min) = 5.521 V (> 5.500 V normal USB vSafe5V max so 4.75-5.50 V USB input never trips OVP), V_OVP(typ) = 5.758 V, and V_OVP(max) = 5.996 V. Replacing U8 with TPS2553DBVR (LCSC C55266, 2.5-6.5 V recommended operating, 7.0 V absolute maximum, 85 mOhm typ Rds(on), active reverse-voltage blocking with 0.01 uA typ / 1 uA max reverse leakage, and 2 us electronic current limit set by R41=35.7k 0.1% to Ios = 667-799 mA < 1.0 A) provides 504 mV recommended-operating margin (6.500 V vs 5.996 V) and 1.004 V absolute-maximum margin (7.000 V vs 5.996 V) across the entire U6 OVP window, while U2 (MCP73832T-2ACI/OT) is also rated 6.0 V recommended operating / 7.0 V absolute maximum. On J2.1, splitting the wake-up diode into D10 (1N4148WS on VBUS -> VBAT_WAKE -> R36 -> Q6 gate) and D13 (1N4148WS on VBUS -> VBAT_SENSE_WAKE -> R37 -> Q8 base / D12) isolates R36 from R37/D12 when VBUS = 0 V, eliminating the 300 kOhm (12 uA) battery bleed path and restoring full V_GS(Q6) = V_VBAT_FUSED (3.0-4.2 V) during battery operation while still waking 0 V UVLO-tripped cells with V_GS(Q6) = 2.07-2.45 V and locking out reversed cells via Q8. Finally, TPS63031DSKR (U4) + 1.5 uH WPN201610U1R5MT (L1) regulates +3V3 across the full 3.0-4.2 V 1S LiPo discharge curve with U4.7 (PS/SYNC) tied high to VSYS for forced PWM full-current mode, C28 (100 nF VINA bypass) and C3 (100 nF VOUT bypass) placed within 1.5 mm of U4, and 2x10 uF 25 V 0603 X5R output capacitors (C8, C27) at U4.1."
  - question: "Display backlight driver and flashing path?"
    choice: "Backlight anode (LEDA, J1.3) fed from VSYS (3.5-4.6 V, bypassed by 1 uF C25) and regulated on cathode (LEDK, J1.2) by CAT4002ASD-GT3 2-channel low-dropout (55 mV typ) constant-current LED driver (U7, LED1+LED2 paralleled for 41.7 mA total via R14=3.6k on RSET per 125x mirror ratio, with 100k pull-ups R39/R40 on LCD_CS/LCD_RES) dimmed on U7.1 (EN/DIM) by ESP32-S3 RTC GPIO21 (U1.25, net LCD_BL_DIM with 100k pulldown R17) using discrete 1-wire EZDim serial pulse bursts (1 to 31 low pulses of 1-50 us width, held static high between brightness changes and low >= 5 ms for shutdown); sealed-enclosure hardware reset via TPS3421EGDRYR (U9, 7.5 s long-press on SW2 -> MCU_EN); firmware flashing via ESP32-S3 native USB D+/D- (GPIO19/GPIO20 with 22R R15/R16 and PESD5V0U1BL D3/D4) and UART0/EN/GPIO0/GND/+3V3/VCHG_RAW internal B.Cu test pads (TP1-TP9) accessed with the rear cover removed"
    reason: "Powering LEDA from VSYS and regulating LEDK with CAT4002ASD-GT3 (55 mV typ dropout at 20.8 mA/ch, programmed to 41.7 mA total by R14=3.6k) provides 300-1400 mV of headroom above the white InGaN LED Vf (3.0-3.2 V), while 100k pull-ups R39/R40 keep LCD_CS and LCD_RES deasserted during MCU reset/deep sleep and TPS3421EGDRYR (U9) provides a 7.5 s long-press hardware reset on SW2."
