      role: button
      process: cnc
      material: "6061-T6 aluminum"
      finish: "Knurled natural titanium anodise with orange accent ring"
      color: "#b8b4ac"
      decor: case/out/crown_cap_decor.stl
      decor_color: "#f05a28"
      description: "9.5 mm diameter knurled rotary crown cap pressed onto the 2.5 mm horizontal shaft of SW1 through the right-wall bore"
    - id: side_button
      file: case/out/side_button.stl
      role: button
      process: cnc
      material: "6061-T6 aluminum / POM inner snap plunger"
      finish: "Matte natural titanium anodise"
      color: "#b8b4ac"
      description: "Right-side pill button pushed in from outside (+X to -X) with integral snap retention barbs engaging the inner wall and pressing SW2"
    - id: action_button
